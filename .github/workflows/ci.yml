name: LOOP CI — Production Build & Test Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Generate Backend Prisma Client
        run: npm --prefix backend run db:generate

      - name: Validate Backend Production Build
        run: npm --prefix backend run build
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: ci-test-secret-min-32-chars-long-12345
          DATABASE_URL: file:./dev.db

      - name: Run Backend Master Test Suites
        run: npm run test
        env:
          NODE_ENV: test
          NEXTAUTH_SECRET: ci-test-secret-min-32-chars-long-12345

      - name: Validate Frontend Production Build
        run: npm --prefix frontend run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
